name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Compile Python
        run: python3 -m compileall -q evals

      - name: Parse YAML
        run: >-
          ruby -e 'require "yaml"; ARGV.each { |path|
          text = File.read(path);
          text = text.split(/^---\s*$/, 3)[1] if path.end_with?("SKILL.md");
          YAML.safe_load(text, permitted_classes: [], aliases: false);
          puts "valid #{path}" }'
          supervised-multi-agent/SKILL.md
          supervised-multi-agent/agents/openai.yaml
          evals/cases.yaml
          evals/host-profiles.yaml

      - name: Validate repository assets
        run: python3 evals/validate_repository.py

      - name: Run tests
        run: python3 -B -m unittest discover -s evals -p 'test_*.py'
